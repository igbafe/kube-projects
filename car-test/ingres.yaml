# Exposes car-service at https://car.cloudwithpeter.site
# Requires a Namecheap CNAME record: car -> NGINX load balancer hostname
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: car-service
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # F5 NGINX rejects a second Ingress for the same host, so cert-manager
    # adds the ACME challenge path to this Ingress instead of creating its own
    acme.cert-manager.io/http01-edit-in-place: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - car.cloudwithpeter.site
      secretName: car-service-tls
  rules:
    - host: car.cloudwithpeter.site
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: car-service
                port:
                  name: http
